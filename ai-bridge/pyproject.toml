[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-bridge"
version = "1.0.0"
description = "Universal AI-to-computer control platform with Model Context Protocol (MCP) and risk-based autonomy engine"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "AI Bridge Engineering Team" }
]
dependencies = [
    "mcp>=1.6.0,<2.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
ai-bridge-mcp = "services.mcp_server.server:main"
ai-bridge-agent-linux = "agents.linux.linux_agent:main"
ai-bridge-agent-windows = "agents.windows.windows_agent:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.pytest.ini_options]
pythonpath = ["packages", "services", "agents", "apps", "src"]
testpaths = ["tests"]
